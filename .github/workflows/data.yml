name: Data sources

on:
  push:
    paths:
      - "scripts/discover_sources.py"
      - "scripts/fetch_sources.py"
      - "data/sources.json"
      - ".github/workflows/data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover_sources.py
