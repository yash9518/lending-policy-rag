name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      agent_eval:
        description: "Run the end-to-end agent eval (uses the Anthropic API)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit + property tests, BM25 eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (no torch needed for these tests)
        run: pip install anthropic rank-bm25 pypdf chromadb streamlit python-dotenv pytest hypothesis
      - run: python -m pytest -q
      - name: Retrieval quality gate (BM25)
        run: python -m evaluation.run_eval --no-dense --min-recall 0.75
      - name: Back-test against real lender decisions (HMDA)
        run: python -m evaluation.hmda_backtest | tee -a "$GITHUB_STEP_SUMMARY"

  retrieval-eval:
    name: Retrieval eval with real embeddings
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/config.py') }}
      - name: Build vector index
        run: python -m src.ingest
      - name: Evaluate BM25 vs dense vs hybrid (quality gate)
        run: python -m evaluation.run_eval --k 3 --min-recall 0.8
      - name: Publish results
        if: always()
        run: cat evaluation/results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: evaluation/results/

  agent-eval:
    name: End-to-end agent eval (needs ANTHROPIC_API_KEY secret)
    needs: retrieval-eval
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-5-5' }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Add an ANTHROPIC_API_KEY repository secret to run the agent eval."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        if: steps.key.outputs.present == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/config.py') }}
      - name: Run agent eval with LLM judge
        if: steps.key.outputs.present == 'true'
        run: |
          python -m src.ingest
          python -m evaluation.run_eval --agent --judge --min-accuracy 0.8
      - name: Publish results
        if: always() && steps.key.outputs.present == 'true'
        run: cat evaluation/results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: agent-eval
          path: evaluation/results/
